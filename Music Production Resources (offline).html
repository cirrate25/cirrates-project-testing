document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

indows: #fbbf24;\n\n  --hero-text: #fef2f2;\n  --hero-shadow: rgb(0 0 0 / .65);\n  --sky-text: #fecaca;\n  --meta-text: #f87171;\n  --pill-bg: rgb(185 28 28 / .15);\n  --pill-bg-hover: rgb(185 28 28 / .28);\n  --pill-border: rgb(185 28 28 / .45);\n  --pill-text: #fef2f2;\n  --search-a: rgb(245 158 11 / .35);\n  --search-b: rgb(239 68 68 / .3);\n  --search-c: rgb(249 115 22 / .28);\n  --search-text: #fef2f2;\n  --focus-ring: rgb(245 158 11 / .2);\n  --horizon: #982818;\n  --sea-deep: #0c0404;\n}\n\n/* ---------- Base ---------- */\n* { box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; }\n\nbody {\n  position: relative;\n  min-width: 320px;\n  margin: 0;\n  color: var(--ink);\n  background:\n    radial-gradient(ellipse 120% 60% at 50% 28%, var(--glow) 0%, transparent 55%),\n    radial-gradient(ellipse 80% 40% at 50% 30%, rgb(255 224 150 / .15) 0%, transparent 70%),\n    linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 22%, var(--sky-3) 44%, var(--sky-4) 62%, var(--sky-5) 78%, var(--horizon) 90%, var(--sea-deep) 100%) fixed;\n  font-family: \"Space Grotesk\", Arial, sans-serif;\n  overflow-x: hidden;\n}\nbody::after {\n  content: \"\";\n  position: fixed;\n  inset: 0;\n  z-index: 0;\n  pointer-events: none;\n  background:\n    radial-gradient(ellipse 100% 100% at 50% 50%, transparent 50%, rgb(0 0 0 / .3) 100%);\n}\n\n/* ---------- Backdrop scene ---------- */\n.scene-backdrop {\n  position: fixed;\n  inset: 0;\n  z-index: 0;\n  overflow: hidden;\n  pointer-events: none;\n}\n\n.wallpaper-layer {\n  position: absolute;\n  inset: 0;\n  background-size: cover;\n  background-position: center;\n}\n\n.scene-sun {\n  position: absolute;\n  top: 18%;\n  left: 50%;\n  width: 300px;\n  height: 300px;\n  transform: translate(-50%, -50%);\n  border-radius: 50%;\n  overflow: hidden;\n  background: radial-gradient(circle at 50% 32%, var(--sun-core) 0%, var(--sun-mid) 42%, var(--sun-edge) 72%, var(--sun-rim) 100%);\n  box-shadow:\n    0 0 60px 20px var(--sun-glow-a),\n    0 0 130px 45px var(--sun-glow-a),\n    0 0 260px 90px var(--sun-glow-b),\n    0 0 400px 150px var(--sun-glow-b);\n  animation: sun-glow 7s ease-in-out infinite;\n}\n.scene-sun::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: repeating-linear-gradient(0deg, transparent 0 9px, var(--sun-line) 9px 15px);\n}\n.scene-sun::after {\n  content: \"\";\n  position: absolute;\n  inset: -50%;\n  background: radial-gradient(circle at 50% 50%, var(--sun-glow-a) 0%, transparent 50%);\n  opacity: .3;\n  animation: sun-halo 7s ease-in-out infinite;\n}\n\n.scene-ocean {\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  height: 26vh;\n  min-height: 170px;\n  background:\n    linear-gradient(180deg, var(--water-a) 0%, var(--horizon) 18%, var(--water-b) 62%, rgb(0 0 0 / .35) 100%);\n}\n.scene-reflection {\n  position: absolute;\n  left: 50%;\n  bottom: 0;\n  width: 220px;\n  height: 100%;\n  transform: translateX(-50%);\n  background: linear-gradient(180deg, var(--reflection) 0%, var(--sun-glow-b) 30%, transparent 80%);\n  filter: blur(2px);\n  mix-blend-mode: screen;\n  opacity: .85;\n}\n.scene-reflection::after {\n  content: \"\";\n  position: absolute;\n  left: 50%;\n  bottom: 0;\n  width: 120px;\n  height: 70%;\n  transform: translateX(-50%);\n  background: linear-gradient(180deg, var(--reflection) 0%, transparent 90%);\n  filter: blur(4px);\n  mix-blend-mode: screen;\n  opacity: .5;\n}\n.scene-ocean::before {\n  content: \"\";\n  position: absolute;\n  top: -30px;\n  left: 0;\n  right: 0;\n  height: 60px;\n  background: linear-gradient(180deg, transparent 0%, var(--water-a) 100%);\n  filter: blur(8px);\n  opacity: .6;\n}\n/* Foreground ripples drift one way, a finer background layer drifts the\n   other way underneath it — two speeds reads as real water motion instead\n   of one flat scrolling stripe. */\n.scene-waves {\n  position: absolute;\n  inset: 0;\n  background-image: repeating-linear-gradient(180deg, rgb(255 255 255 / .1) 0 2px, transparent 2px 18px);\n  background-size: 240px 100%;\n  opacity: .65;\n  animation: wave-drift 6s linear infinite;\n}\n.scene-waves::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background-image: repeating-linear-gradient(180deg, rgb(255 255 255 / .16) 0 1px, transparent 1px 10px);\n  background-size: 150px 100%;\n  opacity: .45;\n  animation: wave-drift 3.4s linear infinite reverse;\n}\n.scene-waves::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background-image:\n    radial-gradient(circle, rgb(255 255 255 / .5) 0 1.5px, transparent 1.5px),\n    radial-gradient(circle, rgb(255 255 255 / .35) 0 1px, transparent 1px);\n  background-size: 90px 46px, 60px 34px;\n  background-position: 0 0, 30px 18px;\n  mix-blend-mode: screen;\n  opacity: .5;\n  animation: glint-drift 9s linear infinite;\n}\n\n.scene-city {\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  height: 42vh;\n  min-height: 280px;\n  overflow: hidden;\n}\n.scene-city::after {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  height: 40%;\n  background: linear-gradient(180deg, transparent 0%, var(--water-a) 80%, var(--water-b) 100%);\n  pointer-events: none;\n  z-index: 2;\n}\n.city-track {\n  position: absolute;\n  bottom: 0;\n  left: 0;\n  display: flex;\n  width: 200%;\n  height: 100%;\n  animation: city-drift 100s linear infinite;\n  will-change: transform;\n}\n.city-track svg { display: block; flex: 0 0 50%; width: 50%; height: 100%; }\n.city-buildings { fill: var(--silhouette); }\n.city-bg { opacity: .3; }\n.city-mid { opacity: .48; }\n.city-fg { opacity: .68; }\n.city-roofs { opacity: .55; }\n.city-towers { opacity: .5; }\n.city-windows { fill: var(--windows); }\n.city-windows-fg { opacity: .55; }\n.city-antennas { stroke: var(--silhouette); fill: var(--silhouette); opacity: .5; }\n.antenna-light { fill: var(--windows); opacity: .8; animation: antenna-blink 3s ease-in-out infinite; }\n.antenna-light:nth-child(odd) { animation-delay: -1.5s; }\n\n.scene-palms { position: absolute; inset: 0; }\n.palm { position: absolute; bottom: -2%; filter: drop-shadow(0 6px 10px rgb(0 0 0 / .25)); }\n.palm svg { display: block; height: 100%; width: auto; }\n.palm-left { left: 5%; height: 56vh; min-height: 340px; animation: palm-sway-left 6s ease-in-out infinite; transform-origin: bottom center; }\n.palm-right { right: 5%; height: 48vh; min-height: 290px; transform: scaleX(-1); animation: palm-sway-right 7s ease-in-out infinite; transform-origin: bottom center; }\n/* Trunk sits slightly darker/warmer than the fronds, with a thin sunset-rim\n   edge on the fronds, so the silhouette reads with a bit of depth instead\n   of one flat solid shape. */\n.palm .palm-trunk { fill: color-mix(in srgb, var(--silhouette) 82%, black); opacity: .94; stroke-width: 0; }\n.palm .palm-fronds path, .palm .palm-fronds .frond {\n  fill: var(--silhouette);\n  opacity: .92;\n  stroke: var(--sun-rim);\n  stroke-width: .6;\n  stroke-opacity: .35;\n  paint-order: stroke fill;\n}\n.palm .palm-fronds .frond { animation: frond-sway 4s ease-in-out infinite; transform-origin: 130px 160px; }\n.palm .palm-fronds .frond:nth-child(odd) { animation-delay: -1s; animation-duration: 3.5s; }\n.palm .palm-fronds .frond:nth-child(3n) { animation-delay: -2s; animation-duration: 4.5s; }\n\n@keyframes frond-sway {\n  0%, 100% { rotate: 0deg; }\n  50% { rotate: 3deg; }\n}\n\n@keyframes palm-sway-left {\n  0%, 100% { rotate: -1deg; }\n  33% { rotate: 1.5deg; }\n  66% { rotate: 0.5deg; }\n}\n@keyframes palm-sway-right {\n  0%, 100% { rotate: 1deg; }\n  33% { rotate: -1.5deg; }\n  66% { rotate: -0.5deg; }\n}\n\n@keyframes sun-glow {\n  0%, 100% { box-shadow: 0 0 60px 20px var(--sun-glow-a), 0 0 130px 45px var(--sun-glow-a), 0 0 260px 90px var(--sun-glow-b), 0 0 400px 150px var(--sun-glow-b); }\n  50% { box-shadow: 0 0 80px 30px var(--sun-glow-a), 0 0 165px 60px var(--sun-glow-a), 0 0 300px 110px var(--sun-glow-b), 0 0 450px 180px var(--sun-glow-b); }\n}\n@keyframes sun-halo {\n  0%, 100% { opacity: .25; transform: scale(1); }\n  50% { opacity: .4; transform: scale(1.05); }\n}\n@keyframes antenna-blink {\n  0%, 40%, 100% { opacity: .8; }\n  50%, 60% { opacity: .15; }\n}\n@keyframes wave-drift { from { background-position: 0 0; } to { background-position: -220px 0; } }\n@keyframes glint-drift { 0% { background-position: 0 0, 30px 18px; opacity: .35; } 50% { opacity: .65; } 100% { background-position: 400px 0, 430px 18px; opacity: .35; } }\n@keyframes city-drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }\n\n@media (prefers-reduced-motion: reduce) {\n  .scene-sun, .scene-waves, .scene-waves::before, .scene-waves::after, .city-track, .antenna-light, .scene-sun::after, .palm, .palm .palm-fronds .frond { animation: none; }\n}\n\n@media (max-width: 720px) {\n  /* Keep inputs/selects at 16px+ on touch so iOS Safari doesn't\n     auto-zoom the page when a field is focused. */\n  input, select, textarea { font-size: 16px !important; }\n  .scene-sun { width: 200px; height: 200px; top: 14%; }\n  .scene-city { height: 34vh; min-height: 220px; }\n  .palm-left { height: 38vh; min-height: 240px; }\n  .palm-right { height: 30vh; min-height: 200px; }\n  .page-shell { width: min(100% - 26px, 1180px); padding-top: 38px; }\n  .hero { padding-bottom: 24px; }\n  .resource-columns { grid-template-columns: 1fr; gap: 13px; margin-top: 13px; }\n  .resource-column { gap: 13px; }\n  .panel { padding: 19px; border-radius: 13px; }\n  .link-form { grid-template-columns: 1fr; }\n  #new-category-wrap { grid-column: auto; }\n  .link-form button { width: 100%; }\n  footer { flex-direction: column; gap: 6px; }\n  .theme-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 11px; }\n  .settings-tab { margin-left:0; }\n  .admin-toolbar { align-items:flex-start; flex-direction:column; }\n}\n@media (max-width: 480px) {\n  .palm-right { display: none; }\n}\n\n/* ---------- Page content ---------- */\n.page-shell { position: relative; z-index: 1; width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 68px 0 30px; }\n\n.hero { padding: 20px 2px 30px; }\n.eyebrow, .meta, footer, .section-note, .link-url, .link-form span, .form-hint, .empty-state {\n  font-family: \"DM Mono\", monospace;\n  letter-spacing: .04em;\n}\n.eyebrow { margin: 0 0 9px; font-size: .76rem; font-weight: 500; color: var(--sky-text); }\nh1, h2, h3, p { margin-top: 0; }\nh1 { max-width: 780px; margin-bottom: 18px; font-size: clamp(2.7rem, 7vw, 5.8rem); line-height: .91; letter-spacing: -.07em; color: var(--hero-text); text-shadow: 0 3px 24px var(--hero-shadow); }\n.meta { margin: 0; font-size: .72rem; color: var(--meta-text); }\n.sync-state { padding: 1px 8px; border: 1px solid var(--pill-border); border-radius: 999px; background: var(--pill-bg); }\n\n.view-tabs { display: flex; gap: 9px; margin: 0 0 20px; }\n.view-tab {\n  padding: 10px 20px;\n  border: 1.5px solid var(--pill-border);\n  border-radius: 999px;\n  background: var(--pill-bg);\n  color: var(--pill-text);\n  font: 600 .8rem \"Space Grotesk\", sans-serif;\n  cursor: pointer;\n  backdrop-filter: blur(3px);\n  transition: transform .15s, background .15s, color .15s;\n}\n.view-tab:hover { transform: translateY(-1px); background: var(--pill-bg-hover); }\n.view-tab.is-active { background: var(--ink); border-color: var(--ink); color: var(--btn-text); }\n\n.search-form { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; margin: 0 0 8px; padding: 7px 9px 7px 14px; border: 1.5px solid var(--pill-border); border-radius: 13px; background: linear-gradient(100deg, var(--search-a), var(--search-b), var(--search-c)); box-shadow: 4px 5px 0 var(--shadow-soft); backdrop-filter: blur(2px); }\n.search-form > span { color: var(--search-text); font-size: 1.5rem; line-height: 1; }\n.search-form input { border: 0; padding: 8px 2px; border-radius: 0; background: transparent; box-shadow: none ; text-underline-offset: 3px; }\n.popular-count { margin-left: auto; flex: 0 0 auto; color: var(--muted); font: 500 .64rem \"DM Mono\", monospace; white-space: nowrap; }\n\n.verified-stamp { margin: 3px 0 0; color: var(--muted); font: .62rem \"DM Mono\", monospace; letter-spacing: .04em; text-align: right; }\n.verified-stamp .verified-dead { color: #e0245e; }\n\n.link-tags { display: inline-flex; gap: 5px; margin-left: 8px; vertical-align: middle; }\n.link-tag {\n  padding: 1px 7px;\n  border: 1px solid var(--line-softer);\n  border-radius: 999px;\n  color: var(--muted);\n  font: 500 .55rem \"DM Mono\", monospace;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n}\n.link-tag.tag-free { color: var(--blue); border-color: var(--line-soft); }\n.link-clicks { color: var(--muted); font: 500 .62rem \"DM Mono\", monospace; opacity: .75; }\n.link-item.link-dead .link-title { text-decoration: line-through; opacity: .65; }\n.link-dead-flag { color: #e0245e; font: 500 .6rem \"DM Mono\", monospace; }\n\n.footer-verified { color: var(--meta-text); font-family: \"DM Mono\", monospace; opacity: .8; }\n.footer-actions { display: flex; gap: 10px; align-items: center; }\n.footer-link {\n  padding: 8px 14px;\n  border: 1px solid var(--pill-border);\n  border-radius: 999px;\n  background: var(--pill-bg);\n  color: var(--pill-text);\n  font: 600 .72rem \"Space Grotesk\", sans-serif;\n  cursor: pointer;\n}\n.footer-link:hover { background: var(--pill-bg-hover); }\n\n/* Keyboard users must always see focus, including inside modals */\n.tools-modal-box:focus-visible,\n.chip:focus-visible,\n.footer-link:focus-visible,\n.onboarding-dismiss:focus-visible,\n.tools-card:focus-visible,\n.tools-cat-card:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }\n\n@media (max-width: 720px) {\n  .filter-bar { flex-direction: column; align-items: stretch; }\n  .filter-tools { justify-content: space-between; }\n  .onboarding-head { flex-direction: column; }\n  .verified-stamp { s=\"import-label secondary-btn\">Import Backup<input id=\"import-links-input\" type=\"file\" accept=\".json\" hidden=\"\"><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fform>\n\n          <p id=\"form-message\" class=\"form-message\" role=\"status\"><\u002Fp>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <div id=\"panel-rules\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-rules\" hidden=\"\">\n        <section class=\"panel rules-panel\" aria-labelledby=\"rules-title\">\n          <div class=\"panel-heading\">\n            <div>\n              <p class=\"eyebrow\">HOUSE RULES<\u002Fp>\n              <h2 id=\"rules-title\">Keep the crate clean<\u002Fh2>\n            <\u002Fdiv>\n            <p class=\"section-note\">Read before you submit a link.<\u002Fp>\n          <\u002Fdiv>\n          <ul class=\"rules-list\">\n            <li class=\"rule-critical\"><strong>Do not add any NSFW links.<\u002Fstrong> This list should stay safe to open anywhere, anytime.<\u002Fli>\n            <li><strong>No dead or broken links.<\u002Fstrong> Test the page yourself before adding it.<\u002Fli>\n            <li><strong>No cracks, warez, or pirated installers.<\u002Fstrong> \"Free\" means officially free.<\u002Fli>\n            <li><strong>Stay on topic.<\u002Fstrong> Music production, mixing, mastering, artwork, video, and audio tools only.<\u002Fli>\n            <li><strong>No spam or affiliate stuffing.<\u002Fstrong> One honest link beats five referral links.<\u002Fli>\n            <li><strong>Credit where it's due.<\u002Fstrong> Don't relabel someone else's tool or work as your own.<\u002Fli>\n            <li><strong>Flag anything shady.<\u002Fstrong> If a link turns bad, say something so it can be pulled.<\u002Fli>\n          <\u002Ful>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <div id=\"panel-discord\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-discord\" hidden=\"\">\n        <section class=\"panel discord-panel\" aria-labelledby=\"discord-title\">\n          <div class=\"panel-heading\">\n            <div>\n              <p class=\"eyebrow\">COMMUNITY<\u002Fp>\n              <h2 id=\"discord-title\">Join the Discord<\u002Fh2>\n            <\u002Fdiv>\n            <p class=\"section-note\">Chat, share tracks, ask for feedback.<\u002Fp>\n          <\u002Fdiv>\n          <a id=\"discord-join\" class=\"discord-join-btn\" href=\"#\" target=\"_blank\" rel=\"noreferrer\" hidden=\"\">Join Discord ↗<\u002Fa>\n          <p id=\"discord-setup-note\" class=\"discord-setup-note\" hidden=\"\">No invite link is set up yet — add one in <code>script.js<\u002Fcode>.<\u002Fp>\n          <div id=\"discord-widget-wrap\" class=\"discord-widget-wrap\" hidden=\"\">\n            <iframe id=\"discord-widget\" title=\"Discord server widget\" src=\"\" width=\"100%\" height=\"380\" allowtransparency=\"true\" frameborder=\"0\" sandbox=\"allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts\"><\u002Fiframe>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <div class=\"youtube-section\">\n          <div class=\"youtube-thumb-wrap\" id=\"youtube-thumb-wrap\">\n            <img id=\"youtube-thumb\" class=\"youtube-thumb\" alt=\"Latest video thumbnail\" loading=\"lazy\" decoding=\"async\" width=\"380\" height=\"280\" hidden=\"\">\n            <div class=\"youtube-thumb-placeholder\" id=\"youtube-thumb-placeholder\">▶<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"youtube-sidebar\">\n            <p class=\"eyebrow\">YOUTUBE<\u002Fp>\n            <h2 id=\"youtube-title\">NEVRAMV<\u002Fh2>\n            <p id=\"youtube-desc\">Beats &amp; tutorials<\u002Fp>\n            <a id=\"youtube-link\" class=\"youtube-link-btn\" href=\"https://www.youtube.com/@NEVRAMV\" target=\"_blank\" rel=\"noreferrer noopener\">Watch on YouTube ▶<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"social-section\">\n          <div class=\"social-card\" id=\"instagram-card\">\n            <div class=\"social-icon\">📷<\u002Fdiv>\n            <div class=\"social-info\">\n              <p class=\"eyebrow\">INSTAGRAM<\u002Fp>\n              <h2 id=\"instagram-title\">endeverrecords<\u002Fh2>\n              <p id=\"instagram-desc\">Follow us on Instagram<\u002Fp>\n              <a id=\"instagram-link\" class=\"social-link-btn instagram-btn\" href=\"https://www.instagram.com/endeverrecords/\" target=\"_blank\" rel=\"noreferrer noopener\">Follow on Instagram ↗<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"panel-themes\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-themes\" hidden=\"\">\n        <section class=\"panel themes-panel\" aria-labelledby=\"themes-title\">\n          <div class=\"panel-heading\">\n            <div>\n              <p class=\"eyebrow\">APPEARANCE<\u002Fp>\n              <h2 id=\"themes-title\">Customize the look<\u002Fh2>\n            <\u002Fdiv>\n            <p class=\"section-note\">Pick a color theme, then add your own wallpaper. Everything stays on your device unless you choose to share.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"themes-section\">\n            <h3 class=\"themes-section-title\">Color Themes<\u002Fh3>\n            <p class=\"themes-section-desc\">One click recolors the entire page. Your choice is remembered.<\u002Fp>\n            <div id=\"theme-grid\" class=\"theme-grid\"><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"themes-section\">\n            <h3 class=\"themes-section-title\">Custom Wallpaper<\u002Fh3>\n            <p class=\"themes-section-desc\">Paste any image URL to use it as the page background. You can also share wallpaper links on the Resources tab so everyone gets them.<\u002Fp>\n            <div id=\"wallpaper-list\" class=\"wallpaper-list\" aria-live=\"polite\"><\u002Fdiv>\n            <form id=\"wallpaper-form\" class=\"wallpaper-form\">\n              <label>\n                <span>Name<\u002Fspan>\n                <input id=\"wallpaper-name\" name=\"name\" type=\"text\" placeholder=\"Neon city night\" required=\"\">\n              <\u002Flabel>\n              <label class=\"wallpaper-url-label\">\n                <span>Image URL<\u002Fspan>\n                <input id=\"wallpaper-url\" name=\"url\" type=\"url\" placeholder=\"https://example.com/wallpaper.jpg\" required=\"\">\n              <\u002Flabel>\n              <div class=\"wallpaper-form-actions\">\n                <button type=\"submit\">Save &amp; apply<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fform>\n            <p id=\"wallpaper-message\" class=\"form-message\" role=\"status\"><\u002Fp>\n          <\u002Fdiv>\n\n          <div class=\"themes-section\">\n            <details class=\"advanced-wallpaper\">\n              <summary>Advanced: custom HTML/CSS/JS backdrop<\u002Fsummary>\n              <label>\n                <span>Name<\u002Fspan>\n                <input id=\"wallpaper-html-name\" type=\"text\" placeholder=\"My animated scene\">\n              <\u002Flabel>\n              <label>\n                <span>HTML snippet<\u002Fspan>\n                <textarea id=\"wallpaper-html\" rows=\"8\" placeholder=\"&lt;div style=&quot;position:absolute;inset:0;background:#111&quot;&gt;&lt;/div&gt;\n&lt;style&gt;/* optional, scope selectors to #custom-scene */&lt;/style&gt;\n&lt;script&gt;/* optional */&lt;/script&gt;\"><\u002Ftextarea>\n              <\u002Flabel>\n              <div class=\"wallpaper-form-actions\">\n                <button type=\"button\" id=\"wallpaper-html-save\">Save &amp; apply snippet<\u002Fbutton>\n              <\u002Fdiv>\n              <p class=\"section-note\">Snippets run in your browser only and are never shared.<\u002Fp>\n            <\u002Fdetails>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <div id=\"panel-tools\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tools\" hidden=\"\">\n<div class=\"tools-panel-content\" x-data=\"{ dawModal: false, audioModal: false, mixingModal: false, distroModal: false, selectedMix: 'eq', eqModal: false, compressorModal: false, reverbModal: false, delayModal: false, satModal: false, synthModal: false, samplerModal: false, meterModal: false, utilityModal: false, modModal: false }\" x-effect=\"document.body.style.overflow = (dawModal || audioModal || mixingModal || distroModal || eqModal || compressorModal || reverbModal || delayModal || satModal || synthModal || samplerModal || meterModal || utilityModal || modModal) ? 'hidden' : ''\">\n\n  <!-- Getting Started -->\n  <div id=\"getting-started\" class=\"panel\">\n    <h2 class=\"panel-heading\">Getting Started<\u002Fh2>\n    <div class=\"tools-grid-3\">\n\n      <div class=\"tools-card\" role=\"button\" tabindex=\"0\" x-on:click=\"dawModal = true\" x-on:keydown.enter=\"dawModal = true\" x-on:keydown.space.prevent=\"dawModal = true\">\n        <div class=\"tools-card-head\">\n          <div class=\"tools-card-icon\">🎛️<\u002Fdiv>\n          <h3>Digital Audio Workstations<\u002Fh3>\n          <span class=\"card-meta\">Click to explore<\u002Fspan>\n        <\u002Fdiv>\n        <p>Browser and desktop DAWs for every platform and budget.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"tools-card\" role=\"button\" tabindex=\"0\" x-on:click=\"audioModal = true\" x-on:keydown.enter=\"audioModal = true\" x-on:keydown.space.prevent=\"audioModal = true\">\n        <div class=\"tools-card-head\">\n          <div class=\"tools-card-icon\">🎧<\u002Fdiv>\n          <h3>Audio Gear<\u002Fh3>\n          <span class=\"card-meta\">Click to explore<\u002Fspan>\n        <\u002Fdiv>\n        <p>Interfaces, monitors, headphones, mics — essential hardware for making music.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"tools-card\" role=\"button\" tabindex=\"0\" x-on:click=\"mixingModal = true\" x-on:keydown.enter=\"mixingModal = true\" x-on:keydown.space.prevent=\"mixingModal = true\">\n        <div class=\"tools-card-head\">\n          <div class=\"tools-card-icon\">🎚️<\u002Fdiv>\n          <h3>Mixing Basics<\u002Fh3>\n          <span class=\"card-meta\">Click to explore<\u002Fspan>\n        <\u002Fdiv>\n        <p>Levels, EQ, compression, and panning — get your tracks sounding polished.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- DAW Modal -->\n  <div x-show=\"dawModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-daw\" x-on:click.away=\"dawModal = false\" x-on:keydown.escape.window=\"dawModal = false\" style=\"display:none;\">\n    <div class=\"tools-modal-bg\" x-on:click=\"dawModal = false\"><\u002Fdiv>\n    <div class=\"tools-modal-box\">\n      <div class=\"tools-modal-header\">\n        <h3 id=\"modal-title-daw\">Digital Audio Workstations<\u002Fh3>\n        <button x-on:click=\"dawModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"tools-modal-grid\">\n\n        <div style=\"grid-column:1/-1;\">\n          <h4 class=\"eyebrow\">Browser Based<\u002Fh4>\n        <\u002Fdiv>\n        <a href=\"https://sesh.fm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\" style=\"border-color:var(--purple);background:rgba(168,85,247,0.08);\">\n          <span class=\"link-name\" style=\"display:flex;align-items:center;gap:8px;\">Sesh.fm <span style=\"font-size:10px;background:rgba(168,85,247,0.2);color:var(--purple);padding:2px 8px;border-radius:9999px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;animation:pulse 2s infinite;\">Try Right Now!<\u002Fspan><\u002Fspan>\n          <span class=\"link-desc\">Real-time collaborative DAW in your browser — no download, just a link and you're making music.<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.bandlab.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">BandLab<\u002Fspan>\n          <span class=\"link-desc\">Free social music-making platform — create, collaborate, and share in your browser<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.soundtrap.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Soundtrap<\u002Fspan>\n          <span class=\"link-desc\">Browser-based collaborative DAW by Spotify — great for beginners<\u002Fspan>\n        <\u002Fa>\n\n        <div style=\"grid-column:1/-1;\">\n          <h4 class=\"eyebrow\">Desktop (Windows &amp; Mac)<\u002Fh4>\n        <\u002Fdiv>\n        <a href=\"https://www.ableton.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Ableton Live<\u002Fspan>\n          <span class=\"link-desc\">Industry standard for electronic music production and live performance<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.image-line.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">FL Studio<\u002Fspan>\n          <span class=\"link-desc\">Popular for beat making with lifetime free updates<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.apple.com/logic-pro\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Logic Pro<\u002Fspan>\n          <span class=\"link-desc\">Mac only — full production suite with great stock libraries<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.avid.com/pro-tools\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Pro Tools<\u002Fspan>\n          <span class=\"link-desc\">Industry standard for recording, mixing, and post-production<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.steinberg.net/cubase\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Cubase<\u002Fspan>\n          <span class=\"link-desc\">Powerful DAW for composing, recording, and mixing<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.presonus.com/studio-one\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Studio One<\u002Fspan>\n          <span class=\"link-desc\">Intuitive drag-and-drop workflow with great stems separation<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.reasonstudios.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Reason<\u002Fspan>\n          <span class=\"link-desc\">Virtual rack-style DAW with built-in instruments and effects<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.bitwig.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Bitwig Studio<\u002Fspan>\n          <span class=\"link-desc\">Modular production environment with powerful clip launcher<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.tracktion.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Waveform<\u002Fspan>\n          <span class=\"link-desc\">Free tier available — cross-platform DAW by Tracktion<\u002Fspan>\n        <\u002Fa>\n\n        <div style=\"grid-column:1/-1;\">\n          <h4 class=\"eyebrow\">Free &amp; Open Source<\u002Fh4>\n        <\u002Fdiv>\n        <a href=\"https://www.reaper.fm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Reaper<\u002Fspan>\n          <span class=\"link-desc\">Extremely customizable, $60 license, fully featured trial<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.bandlab.com/products/cakewalk\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Cakewalk<\u002Fspan>\n          <span class=\"link-desc\">Windows only — full professional DAW, now free<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.apple.com/garageband\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">GarageBand<\u002Fspan>\n          <span class=\"link-desc\">Mac only — free and beginner-friendly Apple DAW<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.audacityteam.org\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Audacity<\u002Fspan>\n          <span class=\"link-desc\">Free open-source audio editor and recorder<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://ardour.org\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Ardour<\u002Fspan>\n          <span class=\"link-desc\">Free open-source DAW for Linux, Mac, and Windows<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://lmms.io\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">LMMS<\u002Fspan>\n          <span class=\"link-desc\">Free open-source DAW for beat making and sequencing<\u002Fspan>\n        <\u002Fa>\n\n        <div style=\"grid-column:1/-1;\">\n          <h4 class=\"eyebrow\">Mobile (iOS &amp; Android)<\u002Fh4>\n        <\u002Fdiv>\n        <a href=\"https://www.image-line.com/fl-studio-mobile\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">FL Studio Mobile<\u002Fspan>\n          <span class=\"link-desc\">iOS / Android — full DAW in your pocket<\u002Fspan>\n          <span style=\"color:var(--muted);font-size:10px;display:block;margin-top:4px;font-style:italic;\">Not recommended without pairing with FL Studio on PC<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.steinberg.net/cubasis\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Cubasis<\u002Fspan>\n          <span class=\"link-desc\">iOS — powerful mobile DAW for iPad and iPhone<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.korg.com/products/software/korg_gadget\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Korg Gadget<\u002Fspan>\n          <span class=\"link-desc\">iOS — groovebox DAW with built-in synths and drum machines<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://apps.apple.com/us/app/garageband/id408709785\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">GarageBand iOS<\u002Fspan>\n          <span class=\"link-desc\">iOS only — Apple's free mobile DAW<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://apps.apple.com/us/app/logic-pro-for-ipad/id1649344888\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Logic Pro for iPad<\u002Fspan>\n          <span class=\"link-desc\">iPad only — Apple's professional DAW on tablet<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.kymatica.com/aum\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">AUM<\u002Fspan>\n          <span class=\"link-desc\">iOS — modular audio mixer and host for iPad<\u002Fspan>\n        <\u002Fa>\n        <a href=\"https://www.beepstreet.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\">\n          <span class=\"link-name\">Drambo<\u002Fspan>\n          <span class=\"link-desc\">iOS — modular groovebox and DAW environment<\u002Fspan>\n        <\u002Fa>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Audio Gear Modal -->\n  <div x-show=\"audioModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-audio\" x-on:click.away=\"audioModal = false\" x-on:keydown.escape.window=\"audioModal = false\" style=\"display:none;\">\n    <div class=\"tools-modal-bg\" x-on:click=\"audioModal = false\"><\u002Fdiv>\n    <div class=\"tools-modal-box\">\n      <div class=\"tools-modal-header\">\n        <h3 id=\"modal-title-audio\">Audio Gear Essentials<\u002Fh3>\n        <button x-on:click=\"audioModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"tools-modal-grid\">\n        <div class=\"tools-gear-card\">\n          <h4>🔊 Audio Interface<\u002Fh4>\n          <p class=\"section-note\">The hub of your studio. Converts analog mic/guitar signals to digital and back. Without one, you get noise and latency.<\u002Fp>\n          <p class=\"gear-note\"><span>Start with:<\u002Fspan> Focusrite Scarlett, Universal Audio<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"tools-gear-card\">\n          <h4>🔈 Studio Monitors<\u002Fh4>\n          <p class=\"section-note\">Flat frequency response — no bass boost or coloration. Hear what's really in your mix, not what your speakers want you to hear.<\u002Fp>\n          <p class=\"gear-note\"><span>Start with:<\u002Fspan> KRK Rokit, Yamaha HS series<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"tools-gear-card\">\n          <h4>🎧 Studio Headphones<\u002Fh4>\n          <p class=\"section-note\">Closed-back for recording (no bleed into mic). Open-back for mixing (natural soundstage). Both essential.<\u002Fp>\n          <p class=\"gear-note\"><span>Start with:<\u002Fspan> Audio-Technica ATH-M50x, Beyerdynamic DT 770/990<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"tools-gear-card\">\n          <h4>🎤 Microphone<\u002Fh4>\n          <p class=\"section-note\">Large-diaphragm condenser for vocals/acoustic. Dynamic (SM57/58) for amps/drums. Skip USB mics — go XLR through an interface.<\u002Fp>\n          <p class=\"gear-note\"><span>Start with:<\u002Fspan> Audio-Technica AT2020, Shure SM57/SM58<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"tools-gear-card\" style=\"grid-column:1/-1;\">\n          <h4>🔇 Soundproofing vs Acoustic Treatment<\u002Fh4>\n           <div class=\"tools-modal-grid-2\">\n            <div class=\"tools-gear-sub\">\n              <span class=\"gear-sub-label\">Soundproofing<\u002Fspan>\n              <p>Keeps sound in/out. Requires dense materials — drywall, mass-loaded vinyl. Expensive, often needs construction.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"tools-gear-sub\">\n              <span class=\"gear-sub-label\">Acoustic Treatment<\u002Fspan>\n              <p>Controls reflections. Absorption panels at first-reflection points, bass traps in corners. Rugs, curtains, bookshelves help too.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"gear-note\" style=\"margin-top:12px;\"><span>Quick tip:<\u002Fspan> Record in a closet full of clothes for natural absorption. Use monitor stands to decouple from desk.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Mixing Basics Modal -->\n  <div x-show=\"mixingModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-mixing\" x-on:click.away=\"mixingModal = false\" x-on:keydown.escape.window=\"mixingModal = false\" style=\"display:none;\">\n    <div class=\"tools-modal-bg\" x-on:click=\"mixingModal = false\"><\u002Fdiv>\n    <div class=\"tools-modal-box wide\">\n      <div class=\"tools-modal-header\">\n        <h3 id=\"modal-title-mixing\">Mixing Basics<\u002Fh3>\n        <button x-on:click=\"mixingModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"section-note\" style=\"margin-bottom:16px;text-align:center;\">W.I.P. — guides to the basics<\u002Fdiv>\n      <div style=\"display:flex;gap:24px;\">\n        <div class=\"tools-mixing-sidebar\">\n          <button x-on:click=\"selectedMix = 'eq'\" style=\"width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:14px;transition:all 0.2s;\" x-bind:style=\"selectedMix === 'eq' ? 'background:rgba(168,85,247,0.1);color:var(--purple);border:1px solid rgba(168,85,247,0.2);' : 'color:var(--muted);border:1px solid transparent;background:transparent;'\">\n            <span style=\"font-weight:500;\">EQ<\u002Fspan>\n            <span style=\"font-size:12px;display:block;color:var(--muted);\">Equalization<\u002Fspan>\n          <\u002Fbutton>\n          <button x-on:click=\"selectedMix = 'compression'\" style=\"width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:14px;transition:all 0.2s;\" x-bind:style=\"selectedMix === 'compression' ? 'background:rgba(168,85,247,0.1);color:var(--purple);border:1px solid rgba(168,85,247,0.2);' : 'color:var(--muted);border:1px solid transparent;background:transparent;'\">\n            <span style=\"font-weight:500;\">Compression<\u002Fspan>\n            <span style=\"font-size:12px;display:block;color:var(--muted);\">Dynamic range<\u002Fspan>\n          <\u002Fbutton>\n          <button x-on:click=\"selectedMix = 'panning'\" style=\"width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:14px;transition:all 0.2s;\" x-bind:style=\"selectedMix === 'panning' ? 'background:rgba(168,85,247,0.1);color:var(--purple);border:1px solid rgba(168,85,247,0.2);' : 'color:var(--muted);border:1px solid transparent;background:transparent;'\">\n            <span style=\"font-weight:500;\">Panning<\u002Fspan>\n            <span style=\"font-size:12px;display:block;color:var(--muted);\">Stereo placement<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:360px;border-radius:12px;background:var(--panel-bg);border:1px solid var(--line);padding:20px;\" x-data=\"{\n            eqLow: 0, eqLowMid: 0, eqHighMid: 0, eqHigh: 0,\n            threshold: -24, ratio: 4, makeup: 0, wave: [],\n            init() {\n                for (let i = 0; i &lt;= 200; i++) {\n                    let t = i / 200;\n                    let section = t &lt; 0.2 ? 0.15 : t &lt; 0.4 ? 0.35 : t &lt; 0.6 ? 0.55 : t &lt; 0.8 ? 0.75 : 0.95;\n                    let env = section;\n                    let val = Math.sin(t * 56.55) * env;\n                    this.wave.push({ x: i * 2, val, env });\n                }\n            },\n            get inputPath() {\n                return 'M' + this.wave.map(d =&gt; `${d.x},${70 - d.val * 50}`).join(' L');\n            },\n            get thresholdLin() {\n                return Math.pow(10, this.threshold / 20);\n            },\n            get makeupLin() {\n                return Math.pow(10, this.makeup / 20);\n            },\n            get compressedPath() {\n                let thresh = this.thresholdLin;\n                let ratio = this.ratio;\n                let mu = this.makeupLin;\n                return 'M' + this.wave.map(d =&gt; {\n                    let absVal = Math.abs(d.val);\n                    let sign = d.val &gt;= 0 ? 1 : -1;\n                    let outVal = absVal;\n                    if (absVal &gt; thresh) {\n                        outVal = thresh + (absVal - thresh) / ratio;\n                    }\n                    outVal = Math.min(outVal * mu, 1);\n                    return `${d.x},${70 - sign * outVal * 50}`;\n                }).join(' L');\n            },\n            get grMax() {\n                let thresh = this.thresholdLin;\n                let ratio = this.ratio;\n                let maxGr = 0;\n                for (let d of this.wave) {\n                    let absVal = Math.abs(d.val);\n                    if (absVal &gt; thresh) {\n                        let after = thresh + (absVal - thresh) / ratio;\n                        let grDb = -20 * Math.log10(absVal / after);\n                        if (grDb &gt; maxGr) maxGr = grDb;\n                    }\n                }\n                return maxGr;\n            },\n            get grEnvelope() {\n                let thresh = this.thresholdLin;\n                let ratio = this.ratio;\n                return this.wave.map(d =&gt; {\n                    let absVal = Math.abs(d.val);\n                    if (absVal &gt; thresh) {\n                        let after = thresh + (absVal - thresh) / ratio;\n                        return 1 - (after / absVal);\n                    }\n                    return 0;\n                });\n            }\n          }\">\n          <!-- EQ Demo -->\n          <template x-if=\"selectedMix === 'eq'\">\n            <div style=\"height:100%;display:flex;flex-direction:column;\">\n              <div style=\"font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;\">\n                <span>20 Hz<\u002Fspan>\n                <span style=\"color:var(--ink);font-weight:500;font-size:14px;\">Frequency Response<\u002Fspan>\n                <span>20 kHz<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:relative;flex:1;background:var(--panel-bg);border-radius:8px;border:1px solid var(--line);overflow:hidden;\">\n                <div style=\"position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,0.1);\"><\u002Fdiv>\n                <div style=\"position:absolute;left:0;right:0;top:25%;height:1px;background:rgba(255,255,255,0.05);\"><\u002Fdiv>\n                <div style=\"position:absolute;left:0;right:0;bottom:25%;height:1px;background:rgba(255,255,255,0.05);\"><\u002Fdiv>\n                <svg style=\"width:100%;height:100%;position:absolute;inset:0;\" viewBox=\"0 0 400 200\" preserveAspectRatio=\"none\">\n                  <path x-bind:d=\"`M0,${100 - eqLow * 6.25} C60,${100 - eqLow * 6.25} 100,${100 - eqLowMid * 6.25} 150,${100 - eqLowMid * 6.25} C200,${100 - eqLowMid * 6.25} 250,${100 - eqHighMid * 6.25} 300,${100 - eqHighMid * 6.25} C330,${100 - eqHighMid * 6.25} 360,${100 - eqHigh * 6.25} 400,${100 - eqHigh * 6.25}`\" fill=\"none\" stroke=\"url(#eqGrad)\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath>\n                  <defs>\n                    <linearGradient id=\"eqGrad\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n                      <stop offset=\"0%\" stop-color=\"#a855f7\" stop-opacity=\"0.6\"><\u002Fstop>\n                      <stop offset=\"50%\" stop-color=\"#a855f7\" stop-opacity=\"1\"><\u002Fstop>\n                      <stop offset=\"100%\" stop-color=\"#a855f7\" stop-opacity=\"0.6\"><\u002Fstop>\n                    <\u002FlinearGradient>\n                  <\u002Fdefs>\n                <\u002Fsvg>\n                <svg style=\"width:100%;height:100%;position:absolute;inset:0;\" viewBox=\"0 0 400 200\" preserveAspectRatio=\"none\">\n                  <path x-bind:d=\"`M0,${100 - eqLow * 6.25} C60,${100 - eqLow * 6.25} 100,${100 - eqLowMid * 6.25} 150,${100 - eqLowMid * 6.25} C200,${100 - eqLowMid * 6.25} 250,${100 - eqHighMid * 6.25} 300,${100 - eqHighMid * 6.25} C330,${100 - eqHighMid * 6.25} 360,${100 - eqHigh * 6.25} 400,${100 - eqHigh * 6.25} L400,200 L0,200 Z`\" fill=\"url(#eqGlow)\" opacity=\"0.15\"><\u002Fpath>\n                  <defs>\n                    <linearGradient id=\"eqGlow\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                      <stop offset=\"0%\" stop-color=\"#a855f7\"><\u002Fstop>\n                      <stop offset=\"100%\" stop-color=\"#a855f7\" stop-opacity=\"0\"><\u002Fstop>\n                    <\u002FlinearGradient>\n                  <\u002Fdefs>\n                <\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px;\">\n                <div style=\"text-align:center;\">\n                  <label style=\"font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;\">Low<\u002Flabel>\n                  <div style=\"font-size:10px;color:var(--muted);\" x-text=\"eqLow.toFixed(1) + ' dB'\"><\u002Fdiv>\n                  <input type=\"range\" min=\"-12\" max=\"12\" step=\"0.5\" x-model=\"eqLow\" style=\"width:100%;height:4px;-webkit-appearance:none;background:var(--line);border-radius:9999px;outline:none;cursor:pointer;\">\n                <\u002Fdiv>\n                <div style=\"text-align:center;\">\n                  <label style=\"font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;\">Low-Mid<\u002Flabel>\n                  <div style=\"font-size:10px;color:var(--muted);\" x-text=\"eqLowMid.toFixed(1) + ' dB'\"><\u002Fdiv>\n                  <input type=\"range\" min=\"-12\" max=\"12\" step=\"0.5\" x-model=\"eqLowMid\" style=\"width:100%;height:4px;-webkit-appearance:none;background:var(--line);border-radius:9999px;outline:none;cursor:pointer;\">\n                <\u002Fdiv>\n                <div style=\"text-align:center;\">\n                  <label style=\"font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;\">High-Mid<\u002Flabel>\n                  <div style=\"font-size:10px;color:var(--muted);\" x-text=\"eqHighMid.toFixed(1) + ' dB'\"><\u002Fdiv>\n                  <input type=\"range\" min=\"-12\" max=\"12\" step=\"0.5\" x-model=\"eqHighMid\" style=\"width:100%;height:4px;-webkit-appearance:none;background:var(--line);border-radius:9999px;outline:none;cursor:pointer;\">\n                <\u002Fdiv>\n                <div style=\"text-align:center;\">\n                  <label style=\"font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;\">High<\u002Flabel>\n                  <div style=\"font-size:10px;color:var(--muted);\" x-text=\"eqHigh.toFixed(1) + ' dB'\"><\u002Fdiv>\n                  <input type=\"range\" min=\"-12\" max=\"12\" step=\"0.5\" x-model=\"eqHigh\" style=\"width:100%;height:4px;-webkit-appearance:none;background:var(--line);border-radius:9999px;outline:none;cursor:pointer;\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Ftemplate>\n\n          <!-- Compressor Demo -->\n          <template x-if=\"selectedMix === 'compression'\">\n            <div style=\"height:100%;display:flex;flex-direction:column;\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;\">\n                <span style=\"font-size:12px;display:flex;align-items:center;gap:8px;\">\n                  <span style=\"width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;\"><\u002Fspan> Input\n                  <span style=\"width:8px;height:8px;border-radius:50%;background:var(--purple);display:inline-block;margin-left:12px;\"><\u002Fspan> Output\n                <\u002Fspan>\n                <span style=\"font-size:12px;color:#f87171;font-weight:500;\" x-show=\"grMax &gt; 0.5\">GR: <span x-text=\"grMax.toFixed(1)\"><\u002Fspan> dB<\u002Fspan>\n                <span style=\"font-size:12px;color:var(--muted);\" x-show=\"grMax &lt;= 0.5\">No compression<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:relative;flex:1;background:var(--panel-bg);border-radius:8px;border:1px solid var(--line);overflow:hidden;\">\n                <div style=\"position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,0.1);\"><\u002Fdiv>\n                <div style=\"position:absolute;left:0;right:0;top:25%;height:1px;background:rgba(255,255,255,0.05);\"><\u002Fdiv>\n                <div style=\"position:absolute;left:0;right:0;bottom:25%;height:1px;background:rgba(255,255,255,0.05);\"><\u002Fdiv>\n                <div style=\"position:absolute;left:0;right:0;height:1px;border-top:1px dashed rgba(248,113,113,0.5);transition:all 100ms;\" x-bind:style=\"'top: ' + ((70 - thresholdLin * 50) / 140 * 100) + '%'\"><\u002Fdiv>\n                <span style=\"position:absolute;font-size:9px;color:rgba(248,113,113,0.6);left:4px;transition:all 100ms;\" x-bind:style=\"'top: calc(' + ((70 - thresholdLin * 50) / 140 * 100) + '% - 10px)'\">Threshold<\u002Fspan>\n                <div style=\"position:absolute;bottom:4px;right:4px;display:flex;align-items:flex-end;gap:1px;height:24px;\">\n                  <template x-for=\"(gr, i) in grEnvelope\" x-bind:key=\"i\">\n                    <div style=\"width:2px;background:rgba(168,85,247,0.6);\" x-bind:style=\"'height: ' + (gr * 24) + 'px'\"><\u002Fdiv>\n                  <\u002Ftemplate>\n                <\u002Fdiv>\n                <svg style=\"width:100%;height:100%;position:absolute;inset:0;\" viewBox=\"0 0 400 140\" preserveAspectRatio=\"none\">\n                  <path x-bind:d=\"inputPath\" fill=\"none\" stroke=\"rgb(113,113,122)\" stroke-width=\"1.5\" opacity=\"0.35\"><\u002Fpath>\n                  <path x-bind:d=\"compressedPath\" fill=\"none\" stroke=\"rgb(168,85,247)\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath>\n                  <path x-bind:d=\"compressedPath\" fill=\"none\" stroke=\"rgb(168,85,247)\" stroke-width=\"6\" opacity=\"0.15\" stroke-linecap=\"round\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;\">\n                <div style=\"text-align:center;\">\n                  <label style=\"font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;\">Threshold<\u002Flabel>\n                  <div style=\"font-size:10px;color:var(--muted);\"><span x-text=\"threshold\"><\u002Fspan> dB<\u002Fdiv>\n                  <input type=\"range\" min=\"-60\" max=\"0\" step=\"1\" x-model=\"threshold\" style=\"width:100%;height:4px;-webkit-appearance:none;background:var(--line);border-radius:9999px;outline:none;cursor:pointer;\">\n                <\u002Fdiv>\n                <div style=\"text-align:center;\">\n                  <label style=\"font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;\">Ratio<\u002Flabel>\n                  <div style=\"font-size:10px;color:var(--muted);\"><span x-text=\"ratio\"><\u002Fspan>:1<\u002Fdiv>\n                  <input type=\"range\" min=\"1\" max=\"20\" step=\"0.5\" x-model=\"ratio\" style=\"width:100%;height:4px;-webkit-appearance:none;background:var(--line);border-radius:9999px;outline:none;cursor:pointer;\">\n                <\u002Fdiv>\n                <div style=\"text-align:center;\">\n                  <label style=\"font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;\">Makeup Gain<\u002Flabel>\n                  <div style=\"font-size:10px;color:var(--muted);\"><span x-text=\"makeup\"><\u002Fspan> dB<\u002Fdiv>\n                  <input type=\"range\" min=\"0\" max=\"20\" step=\"0.5\" x-model=\"makeup\" style=\"width:100%;height:4px;-webkit-appearance:none;background:var(--line);border-radius:9999px;outline:none;cursor:pointer;\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Ftemplate>\n\n          <!-- Panning Demo -->\n          <template x-if=\"selectedMix === 'panning'\">\n            <div style=\"height:100%;display:flex;flex-direction:column;\" x-data=\"{\n                genre: 'classic',\n                showBass: true, showSub: true, showHH: true, showToms: true, showSnare: true, showKick: true, showVocals: true, showAdlibs: true, showEarCandy: true, showGuitar: true, showLead: true, showPiano: true, showStrings: true, showHorns: true,\n                presets: {\n                    classic: { showBass: true, showSub: true, showHH: true, showToms: true, showSnare: true, showKick: true, showVocals: true, showAdlibs: true, showEarCandy: true, showGuitar: true, showLead: true, showPiano: true, showStrings: true, showHorns: true },\n                    metal: { showBass: true, showSub: true, showHH: true, showToms: true, showSnare: true,
