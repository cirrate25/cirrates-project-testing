ndex=\"0\" x-on:click=\"compressorModal = true\" x-on:keydown.enter=\"compressorModal = true\" x-on:keydown.space.prevent=\"compressorModal = true\"><span class=\"cat-icon\">⚡<\u002Fspan><h3>Compressors<\u002Fh3><p>Dynamics<\u002Fp><\u002Fdiv>\n      <div class=\"tools-cat-card\" role=\"button\" tabindex=\"0\" x-on:click=\"reverbModal = true\" x-on:keydown.enter=\"reverbModal = true\" x-on:keydown.space.prevent=\"reverbModal = true\"><span class=\"cat-icon\">🔊<\u002Fspan><h3>Reverbs<\u002Fh3><p>Space &amp; depth<\u002Fp><\u002Fdiv>\n      <div class=\"tools-cat-card\" role=\"button\" tabindex=\"0\" x-on:click=\"delayModal = true\" x-on:keydown.enter=\"delayModal = true\" x-on:keydown.space.prevent=\"delayModal = true\"><span class=\"cat-icon\">🕐<\u002Fspan><h3>Delays<\u002Fh3><p>Echo &amp; rhythm<\u002Fp><\u002Fdiv>\n      <div class=\"tools-cat-card\" role=\"button\" tabindex=\"0\" x-on:click=\"satModal = true\" x-on:keydown.enter=\"satModal = true\" x-on:keydown.space.prevent=\"satModal = true\"><span class=\"cat-icon\">🔥<\u002Fspan><h3>Saturation<\u002Fh3><p>Harmonic color<\u002Fp><\u002Fdiv>\n      <div class=\"tools-cat-card\" role=\"button\" tabindex=\"0\" x-on:click=\"synthModal = true\" x-on:keydown.enter=\"synthModal = true\" x-on:keydown.space.prevent=\"synthModal = true\"><span class=\"cat-icon\">🎹<\u002Fspan><h3>Synths<\u002Fh3><p>Sound generators<\u002Fp><\u002Fdiv>\n      <div class=\"tools-cat-card\" role=\"button\" tabindex=\"0\" x-on:click=\"samplerModal = true\" x-on:keydown.enter=\"samplerModal = true\" x-on:keydown.space.prevent=\"samplerModal = true\"><span class=\"cat-icon\">💿<\u002Fspan><h3>Samplers<\u002Fh3><p>Play &amp; chop<\u002Fp><\u002Fdiv>\n      <div class=\"tools-cat-card\" role=\"button\" tabindex=\"0\" x-on:click=\"meterModal = true\" x-on:keydown.enter=\"meterModal = true\" x-on:keydown.space.prevent=\"meterModal = true\"><span class=\"cat-icon\">📈<\u002Fspan><h3>Meters<\u002Fh3><p>Analyze &amp; measure<\u002Fp><\u002Fdiv>\n      <div class=\"tools-cat-card\" role=\"button\" tabindex=\"0\" x-on:click=\"utilityModal = true\" x-on:keydown.enter=\"utilityModal = true\" x-on:keydown.space.prevent=\"utilityModal = true\"><span class=\"cat-icon\">🔧<\u002Fspan><h3>Utility<\u002Fh3><p>Limiters &amp; clippers<\u002Fp><\u002Fdiv>\n      <div class=\"tools-cat-card\" role=\"button\" tabindex=\"0\" x-on:click=\"modModal = true\" x-on:keydown.enter=\"modModal = true\" x-on:keydown.space.prevent=\"modModal = true\"><span class=\"cat-icon\">🔄<\u002Fspan><h3>Modulation<\u002Fh3><p>Chorus, flange, phase<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- EQ Modal -->\n    <div x-show=\"eqModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-eq\" x-on:click.away=\"eqModal = false\" x-on:keydown.escape.window=\"eqModal = false\" style=\"display:none;\">\n      <div class=\"tools-modal-bg\" x-on:click=\"eqModal = false\"><\u002Fdiv>\n      <div class=\"tools-modal-box\">\n        <div class=\"tools-modal-header\"><h3 id=\"modal-title-eq\">📊 Free EQ Plugins<\u002Fh3><button x-on:click=\"eqModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"tools-modal-link-list\">\n          <a href=\"https://www.tokyodawn.net/tdr-nova/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TDR Nova<\u002Fspan><span class=\"link-desc\">Dynamic parametric EQ — 4 bands that can react to the incoming signal. Brilliant for de-essing, taming harsh frequencies, and frequency-selective compression.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.tokyodawn.net/tdr-slickeq/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TDR SlickEQ<\u002Fspan><span class=\"link-desc\">Mixing EQ with three switchable voicing modes (American, British, German). 3 bands with filters — great for shaping tone on individual tracks or buses.<\u002Fspan><\u002Fa>\n          <a href=\"https://zlplugins.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">ZL Equalizer<\u002Fspan><span class=\"link-desc\">Clean, modern parametric EQ with up to 8 bands, linear phase mode, and a built-in spectrum analyzer. No frills, just surgical precision.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.meldaproduction.com/MEqualizer\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">MEqualizer (MeldaProduction)<\u002Fspan><span class=\"link-desc\">6-band parametric EQ with spectrum analyzer, mid/side processing, and smart filter shapes. Part of the Melda FreeFX bundle.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.reaper.fm/reaplugs/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">ReaEQ (Cockos)<\u002Fspan><span class=\"link-desc\">Surgical EQ included with Reaper, also available as a free standalone VST. Clean interface, up to 64 bands, and extremely low CPU.<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Compressor Modal -->\n    <div x-show=\"compressorModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-compressor\" x-on:click.away=\"compressorModal = false\" x-on:keydown.escape.window=\"compressorModal = false\" style=\"display:none;\">\n      <div class=\"tools-modal-bg\" x-on:click=\"compressorModal = false\"><\u002Fdiv>\n      <div class=\"tools-modal-box\">\n        <div class=\"tools-modal-header\"><h3 id=\"modal-title-compressor\">⚡ Free Compressor Plugins<\u002Fh3><button x-on:click=\"compressorModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"tools-modal-link-list\">\n          <a href=\"https://www.tokyodawn.net/tdr-kotelnikov/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TDR Kotelnikov<\u002Fspan><span class=\"link-desc\">Mastering-grade wideband compressor. Transparent, precise, with separate release times for peak and RMS content.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.audiodamage.com/products/ad046-rough-rider-3\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Rough Rider 3 (Audio Damage)<\u002Fspan><span class=\"link-desc\">Character compressor with a unique sound. Huge range from subtle gluing to aggressive pumping. Great for drums and creative bus processing.<\u002Fspan><\u002Fa>\n          <a href=\"https://klanghelm.com/contents/products/MJUCjr\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">MJUC Jr. (Klanghelm)<\u002Fspan><span class=\"link-desc\">Vari-mu tube compressor modeled after vintage hardware. Warm, musical compression for vocals, bass, and buses.<\u002Fspan><\u002Fa>\n          <a href=\"https://xferrecords.com/freeware/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">OTT (Xfer Records)<\u002Fspan><span class=\"link-desc\">Multiband upward/downward compressor extracted from Ableton's multiband dynamics. Absolute staple in electronic music for punchy, loud, aggressive mixes.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.analogobsession.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">LALA (Analog Obsession)<\u002Fspan><span class=\"link-desc\">LA-2A-style optical compressor. Smooth, natural leveling for vocals, bass, and bus processing.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.deadduckmusic.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">DC1A (Dead Duck)<\u002Fspan><span class=\"link-desc\">Simple, clean compressor with a surprisingly good sound. Just threshold, ratio, attack, release, and makeup.<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Reverb Modal -->\n    <div x-show=\"reverbModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-reverb\" x-on:click.away=\"reverbModal = false\" x-on:keydown.escape.window=\"reverbModal = false\" style=\"display:none;\">\n      <div class=\"tools-modal-bg\" x-on:click=\"reverbModal = false\"><\u002Fdiv>\n      <div class=\"tools-modal-box\">\n        <div class=\"tools-modal-header\"><h3 id=\"modal-title-reverb\">🔊 Free Reverb Plugins<\u002Fh3><button x-on:click=\"reverbModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"tools-modal-link-list\">\n          <a href=\"https://valhalladsp.com/shop/reverb/valhalla-supermassive/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Valhalla Supermassive<\u002Fspan><span class=\"link-desc\">Massive reverb/delay hybrid with 18+ celestial modes. Huge ambient tails, warp effects, and near-zero CPU.<\u002Fspan><\u002Fa>\n          <a href=\"https://michaelwillis.com/dragonfly-reverb/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Dragonfly Reverb<\u002Fspan><span class=\"link-desc\">Open-source algorithmic reverb with Hall, Plate, and Room algorithms. Smooth, natural, and extensively tweakable.<\u002Fspan><\u002Fa>\n          <a href=\"https://tal-software.com/products/tal-reverb-4\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TAL-Reverb-4<\u002Fspan><span class=\"link-desc\">Vintage plate reverb modeled after classic hardware. Simple controls, low CPU, and a character that sits beautifully in dense mixes.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.denisTihanov.com/orilriver/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">OrilRiver<\u002Fspan><span class=\"link-desc\">Algorithmic reverb with rich modulation and a wide range of spaces. Chamber, hall, plate, and room models.<\u002Fspan><\u002Fa>\n          <a href=\"https://impulserecord.com/convology-xt/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Convology XT<\u002Fspan><span class=\"link-desc\">Convolution reverb that loads real impulse responses. Free edition ships with a solid library of spaces.<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Delay Modal -->\n    <div x-show=\"delayModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-delay\" x-on:click.away=\"delayModal = false\" x-on:keydown.escape.window=\"delayModal = false\" style=\"display:none;\">\n      <div class=\"tools-modal-bg\" x-on:click=\"delayModal = false\"><\u002Fdiv>\n      <div class=\"tools-modal-box\">\n        <div class=\"tools-modal-header\"><h3 id=\"modal-title-delay\">🕐 Free Delay Plugins<\u002Fh3><button x-on:click=\"delayModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"tools-modal-link-list\">\n          <a href=\"https://valhalladsp.com/shop/reverb/valhalla-supermassive/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Valhalla Supermassive<\u002Fspan><span class=\"link-desc\">Also counts as a delay — feedback delay networks with delays up to 2 seconds. Slapbacks, ping-pong, and endless cascading echoes.<\u002Fspan><\u002Fa>\n          <a href=\"https://tal-software.com/products/tal-dub-x\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TAL-Dub-X<\u002Fspan><span class=\"link-desc\">Tape echo emulation with modulation. Self-oscillation, wow &amp; flutter, and a built-in filter.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.mkultraaudio.com/nastydl\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">NastyDL (MKultra)<\u002Fspan><span class=\"link-desc\">Dirty analog-style delay with drive, modulation, and filtering. Great for lo-fi and gritty delay textures.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.reaper.fm/reaplugs/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">ReaDelay (Cockos)<\u002Fspan><span class=\"link-desc\">Clean, flexible multi-tap delay. Up to 8 taps with independent pan, volume, pitch shift, and filtering per tap.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.bluecataudio.com/Products/Product_Flanger/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Blue Cat's Delay<\u002Fspan><span class=\"link-desc\">Simple, clean delay with dual left/right channels, feedback, and pan. Part of Blue Cat's freeware pack.<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Saturation Modal -->\n    <div x-show=\"satModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-sat\" x-on:click.away=\"satModal = false\" x-on:keydown.escape.window=\"satModal = false\" style=\"display:none;\">\n      <div class=\"tools-modal-bg\" x-on:click=\"satModal = false\"><\u002Fdiv>\n      <div class=\"tools-modal-box\">\n        <div class=\"tools-modal-header\"><h3 id=\"modal-title-sat\">🔥 Free Saturation &amp; Distortion Plugins<\u002Fh3><button x-on:click=\"satModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"tools-modal-link-list\">\n          <a href=\"https://www.softube.com/saturation-knob\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Softube Saturation Knob<\u002Fspan><span class=\"link-desc\">One knob, instant analog warmth. Three modes (Clean, Warm, Dirt) covering everything from subtle tape saturation to crushed distortion.<\u002Fspan><\u002Fa>\n          <a href=\"https://aberrantdsp.com/plugins/ivgi2/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">IVGI2 (Aberrant DSP)<\u002Fspan><span class=\"link-desc\">Saturation and distortion with asymmetric clipping. From subtle harmonic enhancement to aggressive fuzz.<\u002Fspan><\u002Fa>\n          <a href=\"https://varietyofsound.wordpress.com/downloads/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">FerricTDS (Variety of Sound)<\u002Fspan><span class=\"link-desc\">Tape saturation plugin modeled after the Ferrofluid-based tape formulation. Rich, warm harmonic distortion.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.tritik.com/krush/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Krush (Tritik)<\u002Fspan><span class=\"link-desc\">Bitcrusher with built-in filtering, LFO modulation, and envelope follower. From subtle lo-fi grit to full digital destruction.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.izotope.com/en/products/trash-lite.html\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">iZotope Trash Lite<\u002Fspan><span class=\"link-desc\">Multiband distortion with a huge range of models. From subtle tube warmth to extreme bitcrushing.<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Synth Modal -->\n    <div x-show=\"synthModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-synth\" x-on:click.away=\"synthModal = false\" x-on:keydown.escape.window=\"synthModal = false\" style=\"display:none;\">\n      <div class=\"tools-modal-bg\" x-on:click=\"synthModal = false\"><\u002Fdiv>\n      <div class=\"tools-modal-box\">\n        <div class=\"tools-modal-header\"><h3 id=\"modal-title-synth\">🎹 Free Synth Plugins<\u002Fh3><button x-on:click=\"synthModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"tools-modal-link-list\">\n          <a href=\"https://vital.audio/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Vital (Matt Tytel)<\u002Fspan><span class=\"link-desc\">Wavetable synth that rivals Serum. Visual modulation system, dual filters, integrated FX, and a massive preset community.<\u002Fspan><\u002Fa>\n          <a href=\"https://surge-synthesizer.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Surge XT<\u002Fspan><span class=\"link-desc\">Open-source hybrid synth with wavetable, FM, and analog-style oscillators. Dual filters, built-in FX, and deep modulation.<\u002Fspan><\u002Fa>\n          <a href=\"https://asb2m10.github.io/dexed/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Dexed<\u002Fspan><span class=\"link-desc\">Authentic Yamaha DX7 FM synthesis emulation. Loads original DX7 cartridges, deep 6-operator FM engine.<\u002Fspan><\u002Fa>\n          <a href=\"https://tytel.org/helm/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Helm (Matt Tytel)<\u002Fspan><span class=\"link-desc\">Simple, visual polyphonic synth with a clean interface. Two oscillators, cross-mod, step sequencer, and built-in arpeggiator.<\u002Fspan><\u002Fa>\n          <a href=\"https://tal-software.com/products/tal-noisemaker\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TAL-NoiseMaker<\u002Fspan><span class=\"link-desc\">Virtual analog subtractive synth with a warm, rich sound. Two oscillators, multimode filter, chorus, reverb, delay.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.discodsp.com/obxd/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">OB-Xd (discoDSP)<\u002Fspan><span class=\"link-desc\">Oberheim OB-X emulation with that classic analog polyphonic sound. Thick, lush pads, leads, and basses.<\u002Fspan><\u002Fa>\n          <a href=\"https://sites.google.com/site/mlvst0/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">PG-8X (Martin Lueders)<\u002Fspan><span class=\"link-desc\">Roland JX-8P emulation. Nails that warm, creamy analog sound. Two-DCO architecture with chorus.<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Sampler Modal -->\n    <div x-show=\"samplerModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-sampler\" x-on:click.away=\"samplerModal = false\" x-on:keydown.escape.window=\"samplerModal = false\" style=\"display:none;\">\n      <div class=\"tools-modal-bg\" x-on:click=\"samplerModal = false\"><\u002Fdiv>\n      <div class=\"tools-modal-box\">\n        <div class=\"tools-modal-header\"><h3 id=\"modal-title-sampler\">💿 Free Sampler &amp; Instrument Plugins<\u002Fh3><button x-on:click=\"samplerModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"tools-modal-link-list\">\n          <a href=\"https://labs.spitfireaudio.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Spitfire LABS<\u002Fspan><span class=\"link-desc\">Beautifully sampled instruments — strings, pianos, choirs, synths, and experimental textures. Free and commercially usable.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.decentsamples.com/product/decent-sampler/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Decent Sampler<\u002Fspan><span class=\"link-desc\">Free sample player that loads thousands of free sound libraries from the community. Huge ecosystem of free content.<\u002Fspan><\u002Fa>\n          <a href=\"https://sitala.org/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Sitala<\u002Fspan><span class=\"link-desc\">Drum sampler with instant sample mapping. Drop samples on pads, adjust tuning and envelope, and play.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.tx16wx.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TX16Wx Software Sampler<\u002Fspan><span class=\"link-desc\">Full-featured software sampler with a built-in wave editor. Supports multiple outputs, velocity layers, round-robin.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.native-instruments.com/en/products/komplete/bundles/komplete-start/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Komplete Start (Native Instruments)<\u002Fspan><span class=\"link-desc\">Massive free bundle with 2,000+ sounds, including synths, drums, sampled instruments, and effects.<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Meter Modal -->\n    <div x-show=\"meterModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-meter\" x-on:click.away=\"meterModal = false\" x-on:keydown.escape.window=\"meterModal = false\" style=\"display:none;\">\n      <div class=\"tools-modal-bg\" x-on:click=\"meterModal = false\"><\u002Fdiv>\n      <div class=\"tools-modal-box\">\n        <div class=\"tools-modal-header\"><h3 id=\"modal-title-meter\">📈 Free Metering &amp; Analyzer Plugins<\u002Fh3><button x-on:click=\"meterModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"tools-modal-link-list\">\n          <a href=\"https://youlean.co/youlean-loudness-meter/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">YouLean Loudness Meter<\u002Fspan><span class=\"link-desc\">Industry standard for LUFS loudness metering. Integrated, short-term, momentary, and true peak.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.voxengo.com/product/span/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">SPAN (Voxengo)<\u002Fspan><span class=\"link-desc\">Real-time FFT spectrum analyzer with high precision and low CPU. Stereo/mid/side mode, peak hold.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.tbproaudio.de/products/dpmeter5\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TBProAudio dpMeter 5<\u002Fspan><span class=\"link-desc\">Full LUFS metering suite with integrated, short-term, momentary, and true peak. Supports stereo and surround.<\u002Fspan><\u002Fa>\n          <a href=\"http://www.plektronix.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TT Dynamic Range Meter<\u002Fspan><span class=\"link-desc\">Measures the dynamic range of your track — useful for loudness matching and streaming platform compliance.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.bluecataudio.com/Products/Product_FreqAnalyst/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Blue Cat's FreqAnalyst<\u002Fspan><span class=\"link-desc\">Real-time spectrum analyzer with up to 32K FFT resolution. Peak hold, average mode, and freeze function.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.meldaproduction.com/MFreeform\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">MFreeform (MeldaProduction)<\u002Fspan><span class=\"link-desc\">Multi-tool spectrum analyzer with spectrogram, waveform, and phase correlation display.<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Utility Modal -->\n    <div x-show=\"utilityModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-utility\" x-on:click.away=\"utilityModal = false\" x-on:keydown.escape.window=\"utilityModal = false\" style=\"display:none;\">\n      <div class=\"tools-modal-bg\" x-on:click=\"utilityModal = false\"><\u002Fdiv>\n      <div class=\"tools-modal-box\">\n        <div class=\"tools-modal-header\"><h3 id=\"modal-title-utility\">🔧 Free Utility Plugins — Limiters, Clippers &amp; More<\u002Fh3><button x-on:click=\"utilityModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"tools-modal-link-list\">\n          <a href=\"https://vladgsound.wordpress.com/limiter6/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Limiter No.6 (Vladislav Goncharov)<\u002Fspan><span class=\"link-desc\">Full-featured limiter/maximizer with five processing stages: RMS compressor, peak clipper, peak limiter, saturator, and output stage.<\u002Fspan><\u002Fa>\n          <a href=\"https://loudmax.blogspot.com/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">LoudMax (Christian Budde)<\u002Fspan><span class=\"link-desc\">Simple, transparent brickwall limiter. Just threshold and output — no oversampling needed.<\u002Fspan><\u002Fa>\n          <a href=\"https://kazrog.com/products/kclip-zero\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">KClip Zero (Kazrog)<\u002Fspan><span class=\"link-desc\">Transparent clipper for increasing loudness without pumping. Free version is a clean hard/soft clipper with lookahead.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.meldaproduction.com/MUtility\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">MUtility (MeldaProduction)<\u002Fspan><span class=\"link-desc\">20+ utility modules in one plugin: gain, phase invert, stereo width, M/S encoder, DC offset remover, and more.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.bluecataudio.com/Products/Product_Gain/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Blue Cat's Gain<\u002Fspan><span class=\"link-desc\">Clean gain plugin with dual meters, mute/solo, phase flip, and safe gain staging.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.tokyodawn.net/tdr-esser/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TDR Free Esser<\u002Fspan><span class=\"link-desc\">Dynamic de-esser with automatic threshold and frequency detection. Handles sibilance naturally.<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Modulation Modal -->\n    <div x-show=\"modModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-mod\" x-on:click.away=\"modModal = false\" x-on:keydown.escape.window=\"modModal = false\" style=\"display:none;\">\n      <div class=\"tools-modal-bg\" x-on:click=\"modModal = false\"><\u002Fdiv>\n      <div class=\"tools-modal-box\">\n        <div class=\"tools-modal-header\"><h3 id=\"modal-title-mod\">🔄 Free Modulation Plugins — Chorus, Flanger, Phaser<\u002Fh3><button x-on:click=\"modModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n        <div class=\"tools-modal-link-list\">\n          <a href=\"https://tal-software.com/products/tal-chorus-lx\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">TAL-Chorus-LX<\u002Fspan><span class=\"link-desc\">Juno 60 chorus emulation with that thick, lush analog chorus sound. Three modes covering everything from subtle width to rich modulation.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.bluecataudio.com/Products/Product_Chorus/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Blue Cat's Chorus<\u002Fspan><span class=\"link-desc\">Clean, versatile chorus with rate, depth, mix, and delay controls. Four voices per channel.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.bluecataudio.com/Products/Product_Flanger/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Blue Cat's Flanger<\u002Fspan><span class=\"link-desc\">Classic flanger with feedback control, LFO shape selection, and stereo offset.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.bluecataudio.com/Products/Product_Phaser/\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Blue Cat's Phaser<\u002Fspan><span class=\"link-desc\">Phase shifter with up to 12 stages, feedback, and envelope follower.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.mkultraaudio.com/nasty-chorus\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">Nasty Chorus / Nasty Flanger (MKultra)<\u002Fspan><span class=\"link-desc\">Dirty analog-style modulation — chorus and flanger in one. Drive, modulation, and filtering give it a lo-fi, retro character.<\u002Fspan><\u002Fa>\n          <a href=\"https://www.meldaproduction.com/MChorusMB\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-link-card\"><span class=\"link-name\">MChorusMB (MeldaProduction)<\u002Fspan><span class=\"link-desc\">Multiband chorus — split your signal into bands and apply independent chorus to each. Creates incredibly wide, lush textures.<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Distribution -->\n  <div id=\"posting\" class=\"panel\">\n    <h2 class=\"panel-heading\">📤 Posting — Distribution <span class=\"eyebrow\">Getting your music on platforms<\u002Fspan><\u002Fh2>\n    <p class=\"section-note\">To get your music on paid streaming platforms, you need a distributor. Here's what needs one and what doesn't.<\u002Fp>\n\n    <div class=\"tools-smart-card\">\n      <h3>ℹ️ You Only Need Distributors For<\u002Fh3>\n      <p class=\"section-note\">A distributor delivers your music to the major paid streaming platforms that don't accept direct uploads from artists. These are the platforms you <strong style=\"color:var(--ink);\">need a distributor for<\u002Fstrong>:<\u002Fp>\n      <div class=\"tools-distroway\">\n        <span class=\"tools-tag\">🎵 Spotify<\u002Fspan>\n        <span class=\"tools-tag\">🎵 Apple Music<\u002Fspan>\n        <span class=\"tools-tag\">🎵 Amazon Music<\u002Fspan>\n        <span class=\"tools-tag\">🎵 Tidal<\u002Fspan>\n        <span class=\"tools-tag\">🎵 Deezer<\u002Fspan>\n        <span class=\"tools-tag\">🎵 Pandora<\u002Fspan>\n        <span class=\"tools-tag\">🎵 TikTok Music<\u002Fspan>\n        <span class=\"tools-tag\">🎵 Napster<\u002Fspan>\n        <span class=\"tools-tag\">🎵 iHeartRadio<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"section-note\">You upload your music to the distributor once — they handle delivery to every platform, collect royalties, and pay you out.<\u002Fp>\n      <button x-on:click=\"distroModal = true\" style=\"margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--purple);background:rgba(168,85,247,0.1);padding:6px 12px;border-radius:9999px;border:1px solid rgba(168,85,247,0.2);cursor:pointer;transition:all 0.2s;\">\n        ⚖️ Check %'s distros take\n      <\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"tools-smart-card\">\n      <h3>🌐 Platforms You Can Post To Without a Distributor<\u002Fh3>\n      <p class=\"section-note\">These let you upload music directly — great for building an audience before you invest in distribution.<\u002Fp>\n      <div class=\"tools-distroway\">\n        <span class=\"tools-tag\">🎬 YouTube<\u002Fspan>\n        <span class=\"tools-tag\">🎧 SoundCloud<\u002Fspan>\n        <span class=\"tools-tag\">🎵 Bandcamp<\u002Fspan>\n        <span class=\"tools-tag\">📸 Instagram / Facebook<\u002Fspan>\n        <span class=\"tools-tag\">🎤 TikTok<\u002Fspan>\n        <span class=\"tools-tag\">💿 Audius<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"tools-smart-card\">\n      <h3>💡 The Smart Approach<\u002Fh3>\n      <p class=\"section-note\">Start on SoundCloud, Bandcamp, and YouTube for free. Build an audience. Once you have traction and a few polished tracks, pick a distributor to get on Spotify and Apple Music. DistroKid is the best value for active releasers — unlimited uploads and 0% royalty cut at $24.99/year. If you want a single release and never pay again, CD Baby's one-time fee (9% royalty cut) is the better choice.<\u002Fp>\n      <p class=\"section-note\">Most important: read the fine print on what happens if you stop paying. DistroKid removes your catalog unless you buy Leave a Legacy. CD Baby keeps it up forever — but takes 9% forever too.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Distribution Comparison Modal -->\n  <div x-show=\"distroModal\" x-cloak=\"\" class=\"tools-modal-overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modal-title-distro\" x-on:click.away=\"distroModal = false\" x-on:keydown.escape.window=\"distroModal = false\" style=\"display:none;\">\n    <div class=\"tools-modal-bg\" x-on:click=\"distroModal = false\"><\u002Fdiv>\n    <div class=\"tools-modal-box wide\">\n      <div class=\"tools-modal-header\"><h3 id=\"modal-title-distro\">⚖️ Distributor Comparison — % &amp; Fees<\u002Fh3><button x-on:click=\"distroModal = false\" class=\"tools-modal-close\" aria-label=\"Close dialog\">×<\u002Fbutton><\u002Fdiv>\n      <div style=\"overflow-x:auto;\">\n        <table style=\"width:100%;font-size:14px;text-align:left;\">\n          <thead>\n            <tr style=\"border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);\">\n              <th style=\"padding-bottom:12px;padding-right:12px;font-weight:500;\">Distributor<\u002Fth>\n              <th style=\"padding-bottom:12px;padding-right:12px;font-weight:500;\">Pricing Model<\u002Fth>\n              <th style=\"padding-bottom:12px;padding-right:12px;font-weight:500;\">Royalty Cut<\u002Fth>\n              <th style=\"padding-bottom:12px;padding-right:12px;font-weight:500;\">Stores<\u002Fth>\n              <th style=\"padding-bottom:12px;font-weight:500;\">Catalog Permanence<\u002Fth>\n            <\u002Ftr>\n          <\u002Fthead>\n          <tbody style=\"color:var(--muted);\">\n            <tr style=\"border-bottom:1px solid rgba(255,255,255,0.03);\">\n              <td style=\"padding:12px 12px 12px 0;color:var(--ink);font-weight:500;\">DistroKid<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">$24.99/year unlimited<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">0%<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">150+<\u002Ftd>\n              <td style=\"padding:12px 0;\">Removed if unpaid — $29 Legacy fee per release to keep live<\u002Ftd>\n            <\u002Ftr>\n            <tr style=\"border-bottom:1px solid rgba(255,255,255,0.03);\">\n              <td style=\"padding:12px 12px 12px 0;color:var(--ink);font-weight:500;\">TuneCore<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">$9.99/single/year, $29.99/album/year<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">0%<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">150+<\u002Ftd>\n              <td style=\"padding:12px 0;\">Removed if annual renewal lapses<\u002Ftd>\n            <\u002Ftr>\n            <tr style=\"border-bottom:1px solid rgba(255,255,255,0.03);\">\n              <td style=\"padding:12px 12px 12px 0;color:var(--ink);font-weight:500;\">CD Baby<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">$9.95/single, $29.95/album — one-time<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">9%<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">150+<\u002Ftd>\n              <td style=\"padding:12px 0;\">Stays up forever, no renewals<\u002Ftd>\n            <\u002Ftr>\n            <tr style=\"border-bottom:1px solid rgba(255,255,255,0.03);\">\n              <td style=\"padding:12px 12px 12px 0;color:var(--ink);font-weight:500;\">Amuse<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">$23.99/year unlimited<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">0% (25% penalty if you cancel)<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">~120<\u002Ftd>\n              <td style=\"padding:12px 0;\">25% commission on catalog if you cancel<\u002Ftd>\n            <\u002Ftr>\n            <tr style=\"border-bottom:1px solid rgba(255,255,255,0.03);\">\n              <td style=\"padding:12px 12px 12px 0;color:var(--ink);font-weight:500;\">RouteNote<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">Free or $0-$10/release<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">15% (free) or 0% (premium)<\u002Ftd>\n              <td style=\"padding:12px 12px 12px 0;\">All major<\u002Ftd>\n              <td style=\"padding:12px 0;\">Stays up on free tier<\u002Ftd>\n            <\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Communities -->\n  <div id=\"connecting\" class=\"panel\">\n    <h2 class=\"panel-heading\">👥 Connecting — Communities <span class=\"eyebrow\">Find your people<\u002Fspan><\u002Fh2>\n    <p class=\"section-note\">Free, community-first places where artists connect, collab, and grow together. No paywalls, no gatekeepers — just real music communities.<\u002Fp>\n\n    <div class=\"tools-community-grid\">\n      <div class=\"tools-community-card\">\n        <h4>NeverEndEver <span class=\"community-badge\">We run this<\u002Fspan><\u002Fh4>\n        <p>Our own Discord server + Twitch channel. Weekly music reviews on stream, community playlist, collab finder, feedback exchange, and support from a tight-knit artist community.<\u002Fp>\n        <div class=\"community-links\">\n          <a href=\"https://discord.gg/BjTPyRbHDr\" target=\"_blank\" rel=\"noopener noreferrer\">Discord<\u002Fa>\n          <a href=\"https://www.twitch.tv/neverendever\" target=\"_blank\" rel=\"noopener noreferrer\">Twitch<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tools-community-card\">\n        <h4>🎵 Sesh.fm<\u002Fh4>\n        <p>Real-time collaborative DAW with a built-in community. Make music with anyone instantly in your browser — no download, no setup.<\u002Fp>\n        <div class=\"community-links\"><a href=\"https://sesh.fm\" target=\"_blank\" rel=\"noopener noreferrer\">sesh.fm<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tools-community-card\">\n        <h4>👥 United Underground<\u002Fh4>\n        <p>A Discord community built by and for underground artists. Open verses, collab opportunities, honest track feedback, weekly challenges, cyphers, events, and promotion without spam.<\u002Fp>\n        <div class=\"community-links\"><a href=\"https://discord.gg/undergroundunited\" target=\"_blank\" rel=\"noopener noreferrer\">Discord<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tools-community-card\">\n        <h4>💬 Reddit Communities<\u002Fh4>\n        <p>Active music subreddits for feedback, collabs, and discussion. Post your tracks for honest critique, find producers to work with.<\u002Fp>\n        <div class=\"community-links\">\n          <a href=\"https://reddit.com/r/makinghiphop\" target=\"_blank\" rel=\"noopener noreferrer\">r/makinghiphop<\u002Fa>\n          <a href=\"https://reddit.com/r/WeAreTheMusicMakers\" target=\"_blank\" rel=\"noopener noreferrer\">r/WeAreTheMusicMakers<\u002Fa>\n          <a href=\"https://reddit.com/r/edmproduction\" target=\"_blank\" rel=\"noopener noreferrer\">r/edmproduction<\u002Fa>\n          <a href=\"https://reddit.com/r/musicproduction\" target=\"_blank\" rel=\"noopener noreferrer\">r/musicproduction<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tools-community-card\">\n        <h4>🎮 Producer Discords<\u002Fh4>\n        <p>Large active Discord servers focused on music production. Daily loop/MIDI drops, collab finders, feedback exchanges, weekly contests with prizes.<\u002Fp>\n        <div class=\"community-links\">\n          <a href=\"https://discord.gg/daw\" target=\"_blank\" rel=\"noopener noreferrer\">Prod.By (30k+)<\u002Fa>\n          <a href=\"https://discord.gg/unison\" target=\"_blank\" rel=\"noopener noreferrer\">Unison<\u002Fa>\n          <a href=\"https://discord.gg/wsap\" target=\"_blank\" rel=\"noopener noreferrer\">We Suck At Producing (30k+)<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tools-community-card\">\n        <h4>⚡ Twitch Music Streams<\u002Fh4>\n        <p>Live streams where artists react to music, host beat battles, and build community. Submit your tracks for live feedback.<\u002Fp>\n        <div class=\"community-links\">\n          <a href=\"https://www.twitch.tv/neverendever\" target=\"_blank\" rel=\"noopener noreferrer\">NeverEndEver<\u002Fa>\n          <a href=\"https://www.twitch.tv/therippergames\" target=\"_blank\" rel=\"noopener noreferrer\">TheRipperGames<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Tips for Connecting -->\n    <div class=\"tools-smart-card\">\n      <h3>💡 Tips for Connecting<\u002Fh3>\n      <ul class=\"tools-tips-list\">\n        <li>Be genuine — don't just drop links, actually participate in conversations<\u002Fli>\n        <li>Give feedback before asking for it — build relationships, not drive-by promo<\u002Fli>\n        <li>Join Discord voice chats and Twitch streams — that's where real connections happen<\u002Fli>\n        <li>Submit your music to community playlists and stream review sessions<\u002Fli>\n        <li>Collab with people outside your genre — cross-pollination creates the most interesting music<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Sesh.fm Partner -->\n  <div id=\"sesh\" class=\"tools-partner-card\">\n    <div class=\"tools-partner-head\">\n      <img src=\"https://sesh.fm/logos/color-logo-sm.webp\" alt=\"Sesh\" loading=\"lazy\" decoding=\"async\" width=\"120\" height=\"32\" style=\"height:32px;width:auto;\" onerror=\"this.remove()\">\n      <h2>Sesh.fm<\u002Fh2>\n      <span class=\"partner-badge\">Partner<\u002Fspan>\n    <\u002Fdiv>\n    <p>A collaborative DAW that runs entirely in your browser. No downloads, no setup — just a link and you're making music with your crew in real time.<\u002Fp>\n    <div class=\"tools-partner-grid\">\n      <div class=\"tools-feature-item\">\n        <h3>👥 Real-Time Collaboration<\u002Fh3>\n        <p class=\"section-note\">Multiple people work on the same project simultaneously. See everyone's cursors, record together, and chat built right into the DAW.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tools-feature-item\">\n        <h3>🎵 Full Production Suite<\u002Fh3>\n        <p class=\"section-note\">Beat making, pattern sequencing, pro-grade synthesis (Serum-level), hybrid step sequencer, collaborative piano roll, drag-and-drop arrangement, and mixing — all in the browser.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tools-feature-item\">\n        <h3>🔗 One-Click Sharing<\u002Fh3>\n        <p class=\"section-note\">Copy a project link and send it anywhere — Discord, WhatsApp, TikTok. They click, they're in. No account needed to listen.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tools-feature-item\">\n        <h3>☁️ Cloud Library &amp; Versioning<\u002Fh3>\n        <p class=\"section-note\">18,000+ royalty-free sounds. Auto-saved with unlimited version history — restore any previous snapshot in one click.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tools-feature-item\">\n        <h3>🏆 Small Team, Artist-First<\u002Fh3>\n        <p class=\"section-note\">Self-funded, no VC money. Free tier with unlimited collaborators. Pro at $5/mo unlocks unlimited projects, exports, and commercial rights.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tools-partner-footer\">\n      <a href=\"https://sesh.fm\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-btn tools-btn-primary\">Visit Sesh.fm<\u002Fa>\n      <a href=\"https://sesh.fm/sign-up\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-btn\" style=\"background:var(--pill-bg);border:1px solid var(--pill-border);color:var(--purple);\">Start Creating Free<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Type-o-cord Partner -->\n  <div id=\"typeocord\" class=\"tools-partner-card\">\n    <div class=\"tools-partner-head\">\n      <h2>Type-o-cord<\u002Fh2>\n      <span class=\"partner-badge\">Partner<\u002Fspan>\n    <\u002Fdiv>\n    <p>A Discord text formatting tool by <a href=\"https://wintrboo.xyz\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:var(--purple);\">WintrBoo<\u002Fa> — combines text formatting and timestamp converting into one simple website. Made in collaboration with NeverEndEver.<\u002Fp>\n    <div class=\"tools-partner-grid\">\n      <div class=\"tools-feature-item\">\n        <h3>🔤 Text Formatting<\u002Fh3>\n        <p class=\"section-note\">Format messages with bold, italic, underline, strikethrough, headers, lists, quotes, code blocks, and links — all with a live Discord preview.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tools-feature-item\">\n        <h3>🕐 Timestamp Converter<\u002Fh3>\n        <p class=\"section-note\">Generate Discord timestamp tags for any date and time. Perfect for countdowns and event announcements.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tools-feature-item\">\n        <h3>🎨 Custom Themes<\u002Fh3>\n        <p class=\"section-note\">Personalize the editor with custom accent and secondary accent colors. Save your preferences and format in style.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tools-feature-item\">\n        <h3>🔗 Masked Links<\u002Fh3>\n        <p class=\"section-note\">Insert masked Discord links with display text and URL — no need to remember the markdown syntax.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tools-partner-footer\">\n      <a href=\"https://typeocord.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-btn tools-btn-primary\">Visit Type-o-cord<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- NoPings Partner -->\n  <div id=\"nopings\" class=\"tools-partner-card\">\n    <div class=\"tools-partner-head\">\n      <h2>NoPings<\u002Fh2>\n      <span class=\"partner-badge\">Partner<\u002Fspan>\n    <\u002Fdiv>\n    <p>The best way to share your contact preferences. Let others know exactly when to reach you with a beautiful, personalized page — no sign-up required.<\u002Fp>\n    <div class=\"tools-partner-grid\">\n      <div class=\"tools-feature-item\">\n        <h3>📅 Set Availability<\u002Fh3>\n        <p class=\"section-note\">Choose if and when you want to be contacted. Set boundaries for friends, clients, or colleagues in seconds.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tools-feature-item\">\n        <h3>📤 Instant Sharing<\u002Fh3>\n        <p class=\"section-note\">Share your NoPings page instantly without signing up. Perfect for creators, freelancers, and small businesses.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tools-feature-item\">\n        <h3>✨ Personalized Page<\u002Fh3>\n        <p class=\"section-note\">Tailor your page with your preferences and style. A paid plan with custom URLs is coming soon.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tools-feature-item\">\n        <h3>🛡️ Zero Distractions<\u002Fh3>\n        <p class=\"section-note\">Boost productivity by setting clear digital boundaries. Minimize unwanted interruptions and stay focused.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tools-partner-footer\">\n      <a href=\"https://nopings.com\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"tools-btn tools-btn-primary\">Visit NoPings<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Recommended -->\n  <div class=\"panel\">\n    <h2 class=\"panel-heading\">Recommended<\u002Fh2>\n    <div class=\"tools-recommended-grid\">\n      <div class=\"tools-recommended-card\">\n        <div class=\"tools-rec-head\">\n          <h4>EQ Academy<\u002Fh4>\n          <span class=\"rec-source\">by Mastering The Mix<\u002Fspan>\n        <\u002Fdiv>\n        <p>Free gamified ear-training tool for music producers. 100 interactive levels covering frequency, gain, Q, and mid/side EQ — with global leaderboards and battles.<\u002Fp>\n        <a href=\"https://www.masteringthemix.com/products/eq-academy\" target=\"_blank\">Learn more →<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"tools-recommended-card\">\n        <div class=\"tools-rec-head\">\n          <h4>HISE<\u002Fh4>\n          <span class=\"rec-source\">hise.dev<\u002Fspan>\n        <\u002Fdiv>\n        <p>Open source toolkit for building virtual instruments and audio plugins. Export as VST/AU/AAX for Windows, macOS, and Linux. Scripting + C++ API.<\u002Fp>\n        <a href=\"https://hise.dev\" target=\"_blank\">Visit HISE →<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"tools-recommended-card\">\n        <div class=\"tools-rec-head\">\n          <h4>JUCE<\u002Fh4>\n          <span class=\"rec-source\">juce.com<\u002Fspan>\n        <\u002Fdiv>\n        <p>The C++ framework HISE is built on, for pro plugin dev. Industry-standard toolkit for building audio plugins and applications across all platforms.<\u002Fp>\n        <a href=\"https://juce.com\" target=\"_blank\">Visit JUCE →<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"tools-recommended-card\">\n        <div class=\"tools-rec-head\">\n          <h4>Cardinal<\u002Fh4>\n          <span class=\"rec-source\">cardinal.kx.studio<\u002Fspan>\n        <\u002Fdiv>\n        <p>Free and open-source virtual modular synthesizer plugin. Based on VCV Rack with 1382 built-in modules. Available as AU/CLAP/LV2/VST2/VST3 and standalone.<\u002Fp>\n        <a href=\"https://cardinal.kx.studio\" target=\"_blank\">Download Cardinal →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <footer>\n        <span>CIRRATE · FOR PRODUCERS AND ENGINEERS<\u002Fspan>\n        <span id=\"footer-verified\" class=\"footer-verified\"><\u002Fspan>\n        <span class=\"footer-actions\">\n          <button id=\"show-starters\" class=\"footer-link\" type=\"button\">New here?<\u002Fbutton>\n          <button id=\"settings-reopen\" class=\"settings-reopen-btn\" type=\"button\">⚙ Settings<\u002Fbutton>\n        <\u002Fspan>\n      <\u002Ffooter>\n\n      <aside id=\"settings-panel\" class=\"settings-bottom\" aria-label=\"Settings and admin panel\">\n        <div class=\"panel-heading\">\n          <div>\n            <p class=\"eyebrow\">PREFERENCES<\u002Fp>\n            <h2>Settings<\u002Fh2>\n          <\u002Fdiv>\n          <button id=\"settings-close\" class=\"settings-close\" type=\"button\" aria-label=\"Close settings\">×<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"themes-section\">\n          <h3 class=\"themes-section-title\">Accounts<\u002Fh3>\n          <p class=\"themes-section-desc\">Link your social accounts and channels. They'll appear on the Resources and Community pages.<\u002Fp>\n          <div class=\"accounts-grid\">\n            <div class=\"account-card\">\n              <div class=\"account-icon yt-icon\">▶<\u002Fdiv>\n ton type=\"button\" id=\"youtube-save-btn\">Save YouTube Info<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"themes-section\">\n          <h3 class=\"themes-section-title\">Instagram Profile<\u002Fh3>\n          <p class=\"themes-section-desc\">Instagram is connected: <a href=\"https://www.instagram.com/endeverrecords/\" target=\"_blank\" style=\"color:var(--purple);text-decoration:underline;\">@endeverrecords<\u002Fa><\u002Fp>\n          <div class=\"youtube-settings\">\n            <label>\n              <span>Display Name<\u002Fspan>\n              <input id=\"instagram-name-input\" type=\"text\" placeholder=\"Your Name\">\n            <\u002Flabel>\n            <label>\n              <span>Bio / Description<\u002Fspan>\n              <input id=\"instagram-desc-input\" type=\"text\" placeholder=\"Beats · Mixes · Studio life\">\n            <\u002Flabel>\n            <button type=\"button\" id=\"instagram-save-btn\">Save Instagram Info<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"admin-content\" class=\"admin-content\">\n          <div class=\"admin-toolbar\">\n            <div>\n              <p class=\"eyebrow\">REPORT QUEUE<\u002Fp>\n              <h3 id=\"report-count\">0 reports<\u002Fh3>\n            <\u002Fdiv>\n            <div class=\"admin-toolbar-actions\">\n              <button id=\"refresh-reports\" type=\"button\">Refresh<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"admin-reports\" class=\"admin-reports\"><\u002Fdiv>\n          <p id=\"admin-status\" class=\"form-message\" aria-live=\"polite\"><\u002Fp>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fmain>\n    <script src=\"f2d042cc-d081-4e5b-a81f-926d429e4259\"><\u002Fscript>\n    <script defer=\"\" src=\"fa358ed9-a6da-4ad4-b5b5-d33ef627a8dd\"><\u002Fscript>\n    <script src=\"67b06357-21f0-4381-ac77-887ca76fb2a0\"><\u002Fscript>\n  \n\n<\u002Fbody><\u002Fhtml>"
